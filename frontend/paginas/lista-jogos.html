<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noob Jogo</title>
    <link rel="stylesheet" href="../componentes/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Bibliotéca para os gráficos -->
</head>
<body>

<script src="../componentes/script-cabecalho.js"></script><!-- Com este script o <header></header> exibirá com conteúdo em ../complementos/header.html. OBS.: NÃO TESTEI SE ISSO ATRAPALHO A CONEXÃO DE LOGIN -->
<header></header>

<main>
    <div class="colunas coluna1" id="colunas">
        <div class="blocos">
            <button id="cadastrar-jogo">Cadastrar novo jogo</button><br><br>
            <!-- ⬇⬇⬇ Modal ⬇⬇⬇ -->
            <div id="modal" class="modal">
                <div class="modal-content" id="modal-cadastrar-jogo">
                    <form id="cadastroJogos" action="" method="post">
                        <label>Título: </label>
                        <input type="text" id="titulo-jogo" size="60" name="titulo" placeholder="(Obrigatório)"><br><br>
                        <label>Ano: </label>
                        <input type="text" id="ano-jogo" size="4"  name="ano" placeholder="(Opcional) Digite o ano de lançamento do jogo."><br><br>
                        <label>Idade: </label>
                        <input type="number" id="idade-recomendada-jogo" name="idade" placeholder="(Opcional) Digite a idade mínima indicada."><br><br><!-- número para SE DER TEMPO por filtrar a pesquisa por idade mínima -->
                        <label>Designer: </label>
                        <input type="text" id="designer-jogo" size="60" name="designer" placeholder="(Opcional) Digite o(s) nome(s) do(s) designer(s) do jogo."><br><br>
                        <label>Artista: </label>
                        <input type="text" id="artista-jogo"  size="60" name="artista" placeholder="(Opcional) Digite o(s) nome(s) do(s) artista(s) do jogo."><br><br>
                        <label>Editora: </label>
                        <input type="text" id="editora-jogo" size="60" name="editora" placeholder="(Opcional) Digite o nome da editora do jogo"><br><br>
                        <label>Versão digital: </label>
                        <input type="url" id="digital-jogo" name="digital" placeholder="(Opcional) Digite o endereço web completo da versão digital."><br><br>
                        <label>Categoria: </label>
                        <input type="text" id="categoria-jogo" size="60" name="categoria" placeholder="(Opcional) Competitivo, competitivo em grupo, cooperativo, semicooperativo, solo"><br><br>
                        <label>Componentes: </label>
                        <input type="text" id="componentes-jogo" size="60" name="componentes" placeholder="(Opcional) Meeples, cartas, tabuleiro, moedas..."><br><br>
                        <label>Descrição: </label>
                        <textarea id="descricao-jogo" rows="5" cols="60" name="descricao" placeholder="(Opcional) Conte como este jogo é."></textarea><br><br>
                        <label>Capa: </label>
                        <input type="file" id="capa-jogo" name="file" accept="image/*"><br><br>
                        <div class="modal-buttons">
                            <button type="button" id="btnCadastrarJogo">Adicionar jogo</button>
                            <button type="button" id="btnCancelarJogo">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- ⬆⬆⬆ Modal ⬆⬆⬆ -->

            <!-- Filtros -->
            <button id="limparFiltros">Limpar Filtros</button><br>
            <label for="filtroTitulo">Pesquisar jogo: </label><br>
            <input type="text" id="filtroTitulo" placeholder="Digite o nome..."><br><br>
            <label for="filtroTitulo">Filtrar por categoria:</label><br>
            <div id="checkboxContainer">
                <!-- Aqui serão gerados os checkboxes dinamicamente -->
            </div>
        </div>
    </div>
    <div class="colunas coluna2" id="colunas">
        <div class="scrollable" id="contentContainer">
            <div class="lista-jogos" id="lista-jogo"></div>
            <div id="pagination"></div>
        </div>
    </div>
</main>

<script src="../componentes/script-geral.js"></script>
<script type="module" src="../componentes/script-lista-jogos.js"></script>

</body>
</html>
